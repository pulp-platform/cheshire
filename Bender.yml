package:
  name: cheshire
  authors:
    - "Nicole Narr <narrn@student.ethz.ch>"
    - "Christopher Reinwardt <creinwar@student.ethz.ch>"
    - "Paul Scheffler <paulsc@iis.ee.ethz.ch>"
    - "Alessandro Ottaviano <aottaviano@iis.ee.ethz.ch>"
    - "Thomas Benz <tbenz@iis.ee.ethz.ch>"

dependencies:
  apb:                      { git: "https://github.com/pulp-platform/apb.git",                    rev: common-cells-v2 }
  apb_uart:                 { git: "https://github.com/pulp-platform/apb_uart.git",               rev: common-cells-v2 }
  axi:                      { git: "https://github.com/pulp-platform/axi.git",                    rev: 0ccc838fe06aeeb857eb83c6be9a915c4bf99566 } # branch: devel
  axi_llc:                  { git: "https://github.com/pulp-platform/axi_llc.git",                rev: gwaihir-common-cells-v2 }
  axi_riscv_atomics:        { git: "https://github.com/pulp-platform/axi_riscv_atomics.git",      rev: common-cells-v2 }
  axi_rt:                   { git: "https://github.com/pulp-platform/axi_rt.git",                 rev: common-cells-v2 }
  axi_vga:                  { git: "https://github.com/pulp-platform/axi_vga.git",                rev: common-cells-v2 }
  clic:                     { git: "https://github.com/pulp-platform/clic.git",                   rev: common-cells-v2 }
  clint:                    { git: "https://github.com/pulp-platform/clint.git",                  version: 0.2.0  }
  common_cells:             { git: "https://github.com/pulp-platform/common_cells.git",           version: 2.0.0-beta }
  common_verification:      { git: "https://github.com/pulp-platform/common_verification.git",    version: 0.2.3  }
  cva6:                     { git: "https://github.com/pulp-platform/cva6.git",                   rev: gwaihir-common-cells-v2 }
  iDMA:                     { git: "https://github.com/pulp-platform/iDMA.git",                   version: 0.6.5  }
  riscv-iommu:              { git: "https://github.com/FondazioneChipsIt/riscv-iommu.git",        rev: chips-it }
  irq_router:               { git: "https://github.com/pulp-platform/irq_router.git",             version: 0.0.1-beta.1 }
  opentitan_peripherals:    { git: "https://github.com/pulp-platform/opentitan_peripherals.git",  rev: common-cells-v2 }
  register_interface:       { git: "https://github.com/pulp-platform/register_interface.git",     rev: common-cells-v2 }
  riscv-dbg:                { git: "https://github.com/pulp-platform/riscv-dbg.git",              rev: common-cells-v2 }
  serial_link:              { git: "https://github.com/pulp-platform/serial_link.git",            rev: common-cells-v2 }
  tagger:                   { git: "https://github.com/pulp-platform/transaction-tagger.git",     rev: common-cells-v2 }
  unbent:                   { git: "https://github.com/pulp-platform/unbent.git",                 rev: common-cells-v2 }
  dram_rtl_sim:             { git: "https://github.com/pulp-platform/dram_rtl_sim.git",           rev: common-cells-v2 }

export_include_dirs:
  - hw/include

sources:
  - hw/future/UsbOhciAxi4.v
  - hw/future/spinal_usb_ohci.sv
  - hw/bootrom/cheshire_bootrom.sv
  - hw/cheshire_addrmap_pkg.sv
  - hw/regs/cheshire_soc_regs_pkg.sv
  - hw/regs/cheshire_soc_regs.sv
  - hw/cheshire_idma_wrap.sv
  - hw/cheshire_pkg.sv
  - hw/cheshire_soc.sv

  - target: any(simulation, test)
    files:
      - target/sim/models/s25fs512s.v
      - target/sim/models/24FC1025.v
      - target/sim/src/vip_cheshire_soc.sv
      - target/sim/src/tb_cheshire_pkg.sv
      - target/sim/src/fixture_cheshire_soc.sv
      - target/sim/src/tb_cheshire_soc.sv

  - target: all(fpga, xilinx)
    files:
      - target/xilinx/src/phy_definitions.svh
      - target/xilinx/src/dram_wrapper_xilinx.sv
      - target/xilinx/src/fan_ctrl.sv
      - target/xilinx/src/regs/chs_xilinx_reg_pkg.sv
      - target/xilinx/src/regs/chs_xilinx_reg_top.sv
      - target/xilinx/src/cheshire_top_xilinx.sv
